services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:7860"
    env_file:
      - ./backend/.env
    environment:
      NORMALIZED_DATA_DIR: /app/data/normalized
    volumes:
      - type: bind
        source: ./data/normalized
        target: /app/data/normalized
        read_only: true
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8000
    depends_on:
      - backend
    restart: always
